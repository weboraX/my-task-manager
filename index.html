<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-wrapper">
    <div class="card">
      <header class="app-header">
        <div class="badge">Study Planner</div>
        <h1>Student To-Do List</h1>
        <p class="subtitle">Keep track of your assignments, readings, and study goals.</p>
        
        <div class="stats-bar" id="statsBar">
          <span id="taskCounter">0 of 0 tasks completed</span>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </header>

      <form id="taskForm" class="task-form" novalidate>
        <div class="input-group">
          <input 
            type="text" 
            id="taskInput" 
            placeholder="e.g., Read Biology Chapter 4, Submit Essay..."
            autocomplete="off"
            aria-label="New task description"
          >
          <button type="submit" id="addBtn" class="btn btn-primary">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>
        <div id="validationMessage" class="validation-message" aria-live="polite"></div>
      </form>

      <div class="list-container">
        <ul id="taskList" class="task-list"></ul>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon-wrap">
            <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
          </div>
          <h3>All Caught Up!</h3>
          <p>You have no active study tasks right now. Add a task above to plan your study session.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
